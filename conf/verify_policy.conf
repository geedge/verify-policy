[SYSTEM]
#1:print on screen, 0:don't
DEBUG_SWITCH = 1
#10:DEBUG, 20:INFO, 30:FATAL
RUN_LOG_LEVEL = 10
RUN_LOG_PATH = "conf/zlog.conf"

disable_coredump=0
enable_breakpad=1
breakpad_minidump_dir="/tmp/verify-policy/crashreport"
enable_breakpad_upload=0
breakpad_upload_url="http://127.0.0.1/"

[CONFIG]
#Number of running threads
thread-nu = 3

[maat]
# 0:json 1: redis 2: iris
maat_input_mode=1
table_info_proxy=./resource/table_info_proxy.conf
table_info_security=./resource/table_info_security.conf
json_cfg_file=./resource/pangu_http.json

stat_switch=1
proxy_stat_file=logs/verify_policy_proxy.status
security_stat_file=logs/verify_policy_security.status
full_cfg_dir=verify-policy/
inc_cfg_dir=verify-policy/

maat_redis_server=192.168.40.131
maat_redis_port_range=7002
maat_redis_db_index=0
effect_interval_s=1
accept_tags={"tags":[{"tag":"location","value":"Astana"}]}

[LISTEN]
#Local monitor port number, default is 9991
port = 9994

